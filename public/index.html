<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101827">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#101827;
 color:#e8edf5;
 font-family:Arial,sans-serif;
 height:100dvh;
 display:flex;
 flex-direction:column;
}

header{
 height:65px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 background:#172234;
 border-bottom:1px solid #29364a;
}

.brand{
 font-size:21px;
 font-weight:bold;
 letter-spacing:2px;
 color:#39c5ff;
}

#newChat{
 background:#24364c;
 color:white;
 border:1px solid #40536c;
 padding:10px 13px;
 border-radius:10px;
}

#chatArea{
 flex:1;
 overflow-y:auto;
 padding:18px 14px;
 width:100%;
 max-width:850px;
 margin:auto;
}

.welcome{
 text-align:center;
 margin:60px 10px;
}

.welcome h1{
 color:#42c8ff;
 font-size:29px;
}

.welcome p{color:#aab8ca}

.message{
 display:flex;
 margin:18px 0;
 gap:10px;
 align-items:flex-start;
}

.avatar{
 width:34px;
 height:34px;
 flex-shrink:0;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:#21405c;
 color:#55d3ff;
 font-weight:bold;
}

.message.user .avatar{
 background:#345044;
 color:#a7f3c0;
}

.content{
 flex:1;
 min-width:0;
 line-height:1.65;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 padding-top:5px;
}

.message.user .content{color:#d5e7ff}
.message.assistant .content{color:#f1f5fa}

#bottom{
 padding:12px 12px max(12px,env(safe-area-inset-bottom));
 background:#101827;
 border-top:1px solid #29364a;
}

#controls{
 max-width:850px;
 margin:auto;
}

#composer{
 display:flex;
 align-items:flex-end;
 gap:8px;
 background:#1c293b;
 border:1px solid #42536a;
 border-radius:18px;
 padding:8px;
}

#messageInput{
 flex:1;
 min-width:0;
 max-height:120px;
 resize:none;
 border:0;
 outline:none;
 background:transparent;
 color:white;
 padding:12px 8px;
 font-size:16px;
 font-family:inherit;
}

#messageInput::placeholder{color:#94a3b8}

.action{
 border:0;
 border-radius:13px;
 padding:12px;
 font-size:17px;
 background:#30435b;
 color:white;
}

#sendButton{
 background:#29b9f3;
 color:#071421;
 font-weight:bold;
}

button:disabled{opacity:.45}

#status{
 text-align:center;
 color:#8da4bc;
 font-size:12px;
 padding-top:9px;
}

#language{
 background:#1c293b;
 color:#dcecff;
 border:1px solid #42536a;
 border-radius:8px;
 padding:5px;
}

@media(min-width:700px){
 #chatArea{padding:25px}
 #bottom{padding-left:25px;padding-right:25px}
}
</style>
</head>

<body>

<header>
 <div class="brand">✦ JARVIS AI</div>
 <button id="newChat">＋ नया चैट</button>
</header>

<main id="chatArea">
 <div class="welcome" id="welcome">
  <h1>नमस्ते! मैं JARVIS हूँ।</h1>
  <p>आज मैं आपकी क्या मदद कर सकता हूँ?</p>
 </div>
</main>

<footer id="bottom">
 <div id="controls">
  <div id="composer">
   <button class="action" id="micButton" type="button" title="बोलकर पूछें">🎤</button>
   <textarea id="messageInput" rows="1"
    placeholder="JARVIS से कुछ भी पूछें..."></textarea>
   <button class="action" id="sendButton" type="button">➤</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center">
   <div id="status">● JARVIS ONLINE</div>
   <select id="language">
    <option value="hi-IN">हिंदी</option>
    <option value="en-US">English</option>
   </select>
  </div>
 </div>
</footer>

<script type="module">
const $ = id => document.getElementById(id);

const chatArea = $("chatArea");
const input = $("messageInput");
const sendButton = $("sendButton");
const micButton = $("micButton");
const status = $("status");
const language = $("language");

const STORAGE_KEY = "jarvis_chat_v6";
let history = [];
let busy = false;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (Array.isArray(saved)) {
    history = saved
      .filter(x => x && ["user","model"].includes(x.role) && typeof x.text === "string")
      .slice(-40);
  }
} catch {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-40)));
  } catch (error) {
    console.error("History save error:", error);
  }
}

function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addMessage(role, text, save = false) {
  $("welcome")?.remove();

  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "assistant");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "आप" : "J";

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = text;

  row.append(avatar, content);
  chatArea.appendChild(row);
  scrollBottom();

  if (save) {
    history.push({role, text});
    history = history.slice(-40);
    saveHistory();
  }

  return content;
}

function renderHistory() {
  for (const item of history) {
    addMessage(item.role, item.text, false);
  }
}

async function askJarvis(message, speakReply = false) {
  message = message.trim();
  if (!message || busy) return;

  busy = true;
  sendButton.disabled = true;
  micButton.disabled = true;

  addMessage("user", message, true);
  const replyBox = addMessage("model", "सोच रहा हूँ...");

  status.textContent = "● GEMINI सोच रहा है...";

  try {
    const { Capacitor } = await import("@capacitor/core");
    const apiBase = Capacitor.isNativePlatform()
      ? "https://jarvis-ai-e5zw.onrender.com"
      : "";
    const response = await fetch(`${apiBase}/api/chat`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        message,
        history: history.slice(0, -1).slice(-12)
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success || !data.reply) {
      throw new Error(data.error || "जवाब नहीं मिला");
    }

    replyBox.textContent = data.reply;

    history.push({role:"model", text:data.reply});
    history = history.slice(-40);
    saveHistory();

    status.textContent = "● JARVIS ONLINE";

    if (speakReply && "speechSynthesis" in window) {
      speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(data.reply);
      speech.lang = language.value;
      speech.rate = 0.95;
      speechSynthesis.speak(speech);
    }

  } catch (error) {
    replyBox.textContent = "माफ़ कीजिए, जवाब नहीं मिला। " + error.message;
    status.textContent = "● CONNECTION ERROR";
    console.error("JARVIS:", error);
  } finally {
    busy = false;
    sendButton.disabled = false;
    micButton.disabled = false;
    input.focus();
    scrollBottom();
  }
}

sendButton.addEventListener("click", () => {
  const text = input.value;
  if (!text.trim()) return;

  input.value = "";
  input.style.height = "auto";
  askJarvis(text, false);
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendButton.click();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

$("newChat").addEventListener("click", () => {
  if (busy) return;

  history = [];
  saveHistory();
  chatArea.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>नमस्ते! मैं JARVIS हूँ।</h1>
      <p>आज मैं आपकी क्या मदद कर सकता हूँ?</p>
    </div>`;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  status.textContent = "● नया चैट शुरू हुआ";
});

async function startVoice() {
  if (busy) return;

  try {
    micButton.disabled = true;
    status.textContent = "● आवाज सुन रहा हूँ...";

    const {Capacitor} = await import("@capacitor/core");

    if (Capacitor.isNativePlatform()) {
      const {SpeechRecognition} = await import("@capacitor-community/speech-recognition");

      const permission = await SpeechRecognition.requestPermissions();

      if (permission.speechRecognition !== "granted") {
        throw new Error("माइक्रोफोन की अनुमति नहीं मिली");
      }

      const result = await SpeechRecognition.start({
        language: language.value,
        maxResults: 1,
        partialResults: false
      });

      const spoken = result.matches?.[0];

      if (spoken) {
        await askJarvis(spoken, true);
      } else {
        status.textContent = "● आवाज समझ नहीं आई";
      }
    } else {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!Recognition) {
        throw new Error("इस ब्राउज़र में Voice Recognition उपलब्ध नहीं है");
      }

      const recognition = new Recognition();
      recognition.lang = language.value;
      recognition.maxAlternatives = 1;
      recognition.interimResults = false;

      recognition.onresult = event => {
        askJarvis(event.results[0][0].transcript, true);
      };

      recognition.onerror = event => {
        status.textContent = "● Voice Error: " + event.error;
      };

      recognition.onend = () => {
        micButton.disabled = false;
      };

      recognition.start();
    }

  } catch (error) {
    status.textContent = "● " + error.message;
    console.error(error);
  } finally {
    micButton.disabled = false;
  }
}

micButton.addEventListener("click", startVoice);

renderHistory();

if (!history.length) {
  status.textContent = "● JARVIS ONLINE";
}
</script>

</body>
</html>
